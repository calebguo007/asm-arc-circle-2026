<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASM Benchmark</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050608;
      --panel: rgba(18, 21, 26, 0.62);
      --hairline: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --text-soft: rgba(255, 255, 255, 0.64);
      --accent: #58b68f;
      --mono: "SF Mono", "Fira Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 12%, rgba(255,255,255,0.04), transparent 24%),
        radial-gradient(circle at 80% 18%, rgba(88,182,143,0.08), transparent 28%),
        linear-gradient(180deg, #060709, #050608 42%, #050608);
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(760px, 100%);
      padding: 28px;
      border-radius: 24px;
      border: 0.5px solid var(--hairline);
      background: var(--panel);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 18px 44px rgba(0,0,0,0.22);
      backdrop-filter: blur(36px) saturate(1.16);
      -webkit-backdrop-filter: blur(36px) saturate(1.16);
    }

    .eyebrow {
      color: var(--text-soft);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 12px;
      font-size: 42px;
      line-height: 0.98;
      letter-spacing: -0.04em;
      font-weight: 620;
    }

    p {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.6;
      max-width: 46ch;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 13px 18px;
      border-radius: 999px;
      border: 0.5px solid rgba(88,182,143,0.28);
      background: rgba(88,182,143,0.12);
      color: #f4fffa;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .secondary {
      color: var(--text-soft);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <section class="shell">
    <div class="eyebrow">Benchmark Placeholder</div>
    <h1>Benchmark page goes here.</h1>
    <p>This route is now wired. You can design the real benchmark presentation in a separate thread without needing to touch workbench routing first.</p>
    <div class="actions">
      <a
        class="primary"
        data-server-href="/workbench"
        data-local-href="./dashboard.html"
        href="./dashboard.html"
      >Open workbench →</a>
      <a
        class="secondary"
        data-server-href="/api/dashboard"
        data-local-href="./dashboard.html"
        href="./dashboard.html"
      >Current workbench</a>
    </div>
  </section>

  <script>
    (() => {
      const isFile = window.location.protocol === "file:";
      document.querySelectorAll("[data-server-href][data-local-href]").forEach((node) => {
        const href = isFile ? node.getAttribute("data-local-href") : node.getAttribute("data-server-href");
        if (href) node.setAttribute("href", href);
      });
    })();
  </script>
</body>
</html>
